[package]
name = "hgb-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "hgb_desktop"
path = "src/lib.rs"

[[bin]]
name = "hgb-desktop"
path = "src/main.rs"

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
reqwest = { workspace = true }
hgb-core = { path = "../hgb-core" }
hgb-nextgen = { path = "../hgb-nextgen" }

[build-dependencies]
tauri-build = "2.0"
