<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f11"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded Base Plate -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#27272a" stroke-width="12"/>
  <!-- Winged Symbol / Falcon Emblem -->
  <path d="M 100 170 C 170 120, 342 120, 412 170 C 350 250, 290 290, 256 380 C 222 290, 162 250, 100 170 Z" fill="url(#purpleGrad)" opacity="0.25"/>
  <!-- Central Code Brackets -->
  <path d="M 160 200 L 96 256 L 160 312" stroke="#38bdf8" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>
  <path d="M 352 200 L 416 256 L 352 312" stroke="#38bdf8" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>
  <!-- Core Sovereign Lightning Bolt -->
  <polygon points="274,150 216,270 268,270 238,368 312,248 260,248" fill="url(#cyanGrad)" filter="url(#glow)"/>
</svg>
