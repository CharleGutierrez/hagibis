name: Hagibis CI Autonomous Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  hagibis-ci:
    name: "Autonomous Blast Radius & Invariant Gate"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust Toolchain Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
        continue-on-error: true

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip reportlab || true

      - name: Run Hagibis CI Action
        uses: ./
        with:
          task: 'full'
          audit-blast-radius: 'true'
          slopsquatting-firewall: 'true'
          verify-specs: 'true'
          validate-masterclass: 'true'
          comment-pr: 'true'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Masterclass 8-Chapter Verification Gate
        run: |
          if command -v uv &> /dev/null; then
            uv run --with reportlab python docs/masterclass/generate_pdf.py --validate-all
          elif [ -f "$HOME/.local/bin/uv" ]; then
            "$HOME/.local/bin/uv" run --with reportlab python docs/masterclass/generate_pdf.py --validate-all
          else
            python3 docs/masterclass/generate_pdf.py --validate-all
          fi

      - name: Workspace Unit Test Verification
        run: |
          cargo test --workspace -- --nocapture
