[workspace]
members = [
    "crates/hgb-core",
    "crates/hgb-storage",
    "crates/hgb-nextgen",
    "crates/hgb-daemon",
    "crates/hgb-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Charle Gutierrez"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/CharleGutierrez/hagibis"
homepage = "https://github.com/CharleGutierrez/hagibis"

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
blake3 = "1.5"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
thiserror = "2.0"
regex = "1.11"
rusqlite = { version = "0.29", features = ["bundled"] }
memmap2 = "0.9"
reqwest = { version = "0.12", features = ["json", "blocking"] }
base64 = "0.22"
sha2 = "0.10"
crossterm = { version = "0.28", features = ["event-stream"] }
unicode-width = "0.2"
ratatui = "0.29"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 0
debug = false
codegen-units = 16

