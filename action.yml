name: 'Hagibis Autonomous Verification & Blast-Radius Action'
description: 'Autonomous AST blast radius radar, slopsquatting supply chain firewall, golden invariant verification, and continuous PGO/BOLT regression auto-tuning for pull requests.'
author: 'Charle Gutierrez'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  task:
    description: 'CI audit task to execute: full, blast-radius, slopsquatting, verify'
    required: false
    default: 'full'
  audit-blast-radius:
    description: 'Perform AST-level blast radius analysis and dependent call site detection'
    required: false
    default: 'true'
  slopsquatting-firewall:
    description: 'Enforce supply chain firewall against hallucinated/typosquatted dependencies'
    required: false
    default: 'true'
  verify-specs:
    description: 'Execute workspace verification gates and compile checks'
    required: false
    default: 'true'
  comment-pr:
    description: 'Post or update the GitHub Flavored Markdown status comment on the active PR'
    required: false
    default: 'true'
  validate-masterclass:
    description: 'Execute verification gates across all 8 masterclass chapters (ch1-ch8) via docs/masterclass/generate_pdf.py --validate-all'
    required: false
    default: 'true'
  regenerate-docs:
    description: 'Automatically regenerate masterclass chapters and PDF via docs/masterclass/generate_pdf.py'
    required: false
    default: 'false'
  check-regression:
    description: 'Execute automated performance benchmark regression check (>5% latency delta in pgo_workload)'
    required: false
    default: 'true'
  regression-threshold:
    description: 'Percentage latency regression threshold before triggering continuous PGO/BOLT optimization'
    required: false
    default: '5.0'
  auto-reoptimize-on-regression:
    description: 'Automatically trigger continuous PGO + BOLT layout optimization when performance regression is detected'
    required: false
    default: 'true'
  optimize-pgo-bolt:
    description: 'Execute automated PGO + LLVM BOLT profiling and release binary optimization for hgb, hgbd, and hgb-wasm-kernel'
    required: false
    default: 'false'
  optimize-masterclass-pgo-bolt:
    description: 'Execute automated simulated masterclass workload PGO + LLVM BOLT profile-guided optimization'
    required: false
    default: 'false'
  masterclass-pgo-iterations:
    description: 'Number of simulated masterclass workload training iterations for PGO profiling'
    required: false
    default: '3'
  masterclass-pgo-cache:
    description: 'Enable cross-run caching of masterclass .profraw and .profdata artifacts'
    required: false
    default: 'true'
  pgo-bolt-cache:
    description: 'Enable caching of PGO raw profile data and BOLT branch trace tables across CI runs'
    required: false
    default: 'true'
  pgo-bolt-ci-mode:
    description: 'Run PGO/BOLT pipeline in headless non-interactive CI mode with automated toolchain detection'
    required: false
    default: 'true'
  pgo-targets:
    description: 'Specific binaries to optimize: all, hgb, hgbd, wasm-kernel'
    required: false
    default: 'all'
  autonomous-self-healing:
    description: 'Trigger autonomous compiler self-healing loop (diagnose stderr, vector fix lookup, and AST patch) on compile/test failures'
    required: false
    default: 'true'
  github-token:
    description: 'GitHub token for PR comment authoring'
    required: false
    default: ${{ github.token }}

outputs:
  blast-score:
    description: 'Calculated architectural blast radius score (0-100)'
    value: ${{ steps.hagibis-runner.outputs.blast_score }}
  blast-severity:
    description: 'Severity level: LOW, MEDIUM, HIGH, or CRITICAL'
    value: ${{ steps.hagibis-runner.outputs.blast_severity }}
  firewall-passed:
    description: 'Whether dependency slopsquatting check passed'
    value: ${{ steps.hagibis-runner.outputs.firewall_passed }}
  verification-passed:
    description: 'Whether all golden invariants and compilation passed'
    value: ${{ steps.hagibis-runner.outputs.verification_passed }}
  masterclass-validated:
    description: 'Whether all 8 masterclass chapters passed verification gates'
    value: ${{ steps.validate-masterclass-step.outputs.validated }}
  regression-passed:
    description: 'Whether performance benchmark remained within regression threshold'
    value: ${{ steps.regression-bench-step.outputs.regression_passed }}
  pgo-bolt-optimized:
    description: 'Whether automated PGO + LLVM BOLT binary optimization succeeded'
    value: ${{ steps.pgo-bolt-optimizer.outputs.optimized }}
  masterclass-pgo-bolt-optimized:
    description: 'Whether automated Masterclass PGO + LLVM BOLT binary layout optimization succeeded'
    value: ${{ steps.masterclass-pgo-bolt-optimizer.outputs.optimized }}

runs:
  using: 'composite'
  steps:
    - name: Ensure Rust toolchain
      shell: bash
      run: |
        if ! command -v cargo &> /dev/null; then
          echo "Installing Rust toolchain..."
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        fi

    - name: Setup sccache compiler cache
      shell: bash
      run: |
        if command -v sccache &> /dev/null; then
          export RUSTC_WRAPPER=sccache
          export SCCACHE_DIR="$HOME/.cache/sccache"
          mkdir -p "$SCCACHE_DIR"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_DIR=$SCCACHE_DIR" >> "$GITHUB_ENV"
        fi

    - name: Build Hagibis Engine Binary
      shell: bash
      run: |
        if ! command -v hgb &> /dev/null; then
          if command -v sccache &> /dev/null; then
            export RUSTC_WRAPPER=sccache
          fi
          cargo build --release -p hgb-cli
          mkdir -p "$HOME/.cargo/bin"
          cp target/release/hgb "$HOME/.cargo/bin/hgb"
        fi

    - name: Run Hagibis CI Verification Suite
      id: hagibis-runner
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_TASK: ${{ inputs.task }}
        INPUT_AUDIT_BLAST: ${{ inputs.audit-blast-radius }}
        INPUT_SLOPSQUATTING: ${{ inputs.slopsquatting-firewall }}
        INPUT_VERIFY: ${{ inputs.verify-specs }}
        INPUT_COMMENT_PR: ${{ inputs.comment-pr }}
      run: |
        hgb ci-action \
          --task "$INPUT_TASK" \
          --summary

    - name: Validate Masterclass Chapters (Ch1-Ch8 Invariant Verification)
      id: validate-masterclass-step
      if: inputs.validate-masterclass == 'true'
      shell: bash
      run: |
        echo "Validating all 8 Masterclass Chapters..."
        if command -v uv &> /dev/null; then
          uv run --with reportlab python docs/masterclass/generate_pdf.py --validate-all
        elif [ -f "$HOME/.local/bin/uv" ]; then
          "$HOME/.local/bin/uv" run --with reportlab python docs/masterclass/generate_pdf.py --validate-all
        elif command -v python3 &> /dev/null; then
          python3 docs/masterclass/generate_pdf.py --validate-all
        else
          python docs/masterclass/generate_pdf.py --validate-all
        fi
        echo "validated=true" >> "$GITHUB_OUTPUT"

    - name: Automate Masterclass & Documentation Pipeline
      if: inputs.regenerate-docs == 'true'
      shell: bash
      run: |
        if command -v uv &> /dev/null; then
          uv run --with reportlab python docs/masterclass/generate_pdf.py
        elif [ -f "$HOME/.local/bin/uv" ]; then
          "$HOME/.local/bin/uv" run --with reportlab python docs/masterclass/generate_pdf.py
        else
          python3 docs/masterclass/generate_pdf.py || true
        fi

    - name: Continuous Benchmark Regression & PGO/BOLT Gate
      id: regression-bench-step
      if: inputs.check-regression == 'true'
      shell: bash
      env:
        REGRESSION_THRESHOLD_PCT: ${{ inputs.regression-threshold }}
        AUTO_OPTIMIZE: ${{ inputs.auto-reoptimize-on-regression }}
      run: |
        echo "Running Continuous Performance Benchmark Regression Check..."
        chmod +x scripts/regression-bench-check.sh scripts/pgo-bolt-optimize.sh scripts/pgo-optimize.sh
        if [ "$AUTO_OPTIMIZE" = "true" ]; then
          bash scripts/regression-bench-check.sh --threshold "$REGRESSION_THRESHOLD_PCT"
        else
          bash scripts/regression-bench-check.sh --threshold "$REGRESSION_THRESHOLD_PCT" --no-auto-optimize
        fi
        echo "regression_passed=true" >> "$GITHUB_OUTPUT"

    - name: Cache PGO / BOLT Profiling Artifacts
      id: pgo-bolt-cache-step
      if: inputs.pgo-bolt-cache == 'true' && (inputs.optimize-pgo-bolt == 'true' || inputs.auto-reoptimize-on-regression == 'true')
      uses: actions/cache@v4
      with:
        path: |
          /tmp/bolt-pgo-data
          /tmp/bolt-pgo-cache
          target/pgo-profiles
        key: pgo-bolt-profile-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'crates/**/src/**') }}
        restore-keys: |
          pgo-bolt-profile-${{ runner.os }}-

    - name: Setup LLVM & BOLT Profiling Toolchain
      if: inputs.optimize-pgo-bolt == 'true' || inputs.auto-reoptimize-on-regression == 'true'
      shell: bash
      run: |
        echo "Ensuring LLVM profiling and BOLT tools are present on CI runner..."
        rustup component add llvm-tools-preview 2>/dev/null || rustup component add llvm-tools 2>/dev/null || true
        if ! command -v llvm-bolt &> /dev/null && command -v apt-get &> /dev/null; then
          echo "Attempting to install llvm-bolt & linux-tools..."
          sudo apt-get update -qq 2>/dev/null || true
          sudo apt-get install -y -qq llvm-bolt linux-tools-generic 2>/dev/null || true
        fi
        echo "LLVM profdata candidate: $(command -v llvm-profdata 2>/dev/null || echo 'sysroot')"
        echo "LLVM BOLT candidate:     $(command -v llvm-bolt 2>/dev/null || echo 'not installed')"

    - name: Automated PGO + LLVM BOLT Optimization Pipeline
      id: pgo-bolt-optimizer
      if: inputs.optimize-pgo-bolt == 'true'
      shell: bash
      env:
        PGO_TARGETS: ${{ inputs.pgo-targets }}
        CI_MODE: ${{ inputs.pgo-bolt-ci-mode }}
      run: |
        echo "Executing Automated PGO + LLVM BOLT Layout Optimization..."
        chmod +x scripts/pgo-bolt-optimize.sh scripts/pgo-optimize.sh
        if [ "$CI_MODE" = "true" ]; then
          bash scripts/pgo-bolt-optimize.sh "$PGO_TARGETS" --ci --verify
        else
          bash scripts/pgo-bolt-optimize.sh "$PGO_TARGETS" --verify
        fi
        echo "optimized=true" >> "$GITHUB_OUTPUT"

    # Masterclass Workload Simulated PGO + BOLT Optimization
    - name: Masterclass Simulated Workload PGO + LLVM BOLT Pipeline
      id: masterclass-pgo-bolt-optimizer
      if: inputs.optimize-masterclass-pgo-bolt == 'true'
      shell: bash
      env:
        ITERATIONS: ${{ inputs.masterclass-pgo-iterations }}
        CI_MODE: 'true'
      run: |
        echo "::group::Executing Hagibis Masterclass PGO + BOLT Super-Optimization"
        chmod +x scripts/pgo-bolt-masterclass-automation.sh 2>/dev/null || true
        if [ -f "scripts/pgo-bolt-masterclass-automation.sh" ]; then
          bash scripts/pgo-bolt-masterclass-automation.sh all --ci --iterations "$ITERATIONS"
        fi
        echo "optimized=true" >> "$GITHUB_OUTPUT"
        echo "::endgroup::"
