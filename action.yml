name: 'Hagibis Autonomous Verification & Blast-Radius Action'
description: 'Autonomous AST blast radius radar, slopsquatting supply chain firewall, and golden invariant verification for pull requests.'
author: 'Charle Gutierrez'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  task:
    description: 'CI audit task to execute: full, blast-radius, slopsquatting, verify'
    required: false
    default: 'full'
  audit-blast-radius:
    description: 'Perform AST-level blast radius analysis and dependent call site detection'
    required: false
    default: 'true'
  slopsquatting-firewall:
    description: 'Enforce supply chain firewall against hallucinated/typosquatted dependencies'
    required: false
    default: 'true'
  verify-specs:
    description: 'Execute workspace verification gates and compile checks'
    required: false
    default: 'true'
  comment-pr:
    description: 'Post or update the GitHub Flavored Markdown status comment on the active PR'
    required: false
    default: 'true'
  validate-masterclass:
    description: 'Execute verification gates across all 8 masterclass chapters (ch1-ch8) via docs/masterclass/generate_pdf.py --validate-all'
    required: false
    default: 'true'
  regenerate-docs:
    description: 'Automatically regenerate masterclass chapters and PDF via docs/masterclass/generate_pdf.py'
    required: false
    default: 'false'
  optimize-pgo-bolt:
    description: 'Execute automated PGO + LLVM BOLT profiling and release binary optimization for hgb and hgbd'
    required: false
    default: 'false'
  github-token:
    description: 'GitHub token for PR comment authoring'
    required: false
    default: ${{ github.token }}

outputs:
  blast-score:
    description: 'Calculated architectural blast radius score (0-100)'
    value: ${{ steps.hagibis-runner.outputs.blast_score }}
  blast-severity:
    description: 'Severity level: LOW, MEDIUM, HIGH, or CRITICAL'
    value: ${{ steps.hagibis-runner.outputs.blast_severity }}
  firewall-passed:
    description: 'Whether dependency slopsquatting check passed'
    value: ${{ steps.hagibis-runner.outputs.firewall_passed }}
  verification-passed:
    description: 'Whether all golden invariants and compilation passed'
    value: ${{ steps.hagibis-runner.outputs.verification_passed }}
  masterclass-validated:
    description: 'Whether all 8 masterclass chapters passed verification gates'
    value: ${{ steps.validate-masterclass-step.outputs.validated }}
  pgo-bolt-optimized:
    description: 'Whether automated PGO + LLVM BOLT binary optimization succeeded'
    value: ${{ steps.pgo-bolt-optimizer.outputs.optimized }}

runs:
  using: 'composite'
  steps:
    - name: Ensure Rust toolchain
      shell: bash
      run: |
        if ! command -v cargo &> /dev/null; then
          echo "Installing Rust toolchain..."
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        fi

    - name: Build Hagibis Engine Binary
      shell: bash
      run: |
        if ! command -v hgb &> /dev/null; then
          cargo build --release -p hgb-cli
          mkdir -p "$HOME/.cargo/bin"
          cp target/release/hgb "$HOME/.cargo/bin/hgb"
        fi

    - name: Run Hagibis CI Verification Suite
      id: hagibis-runner
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_TASK: ${{ inputs.task }}
        INPUT_AUDIT_BLAST: ${{ inputs.audit-blast-radius }}
        INPUT_SLOPSQUATTING: ${{ inputs.slopsquatting-firewall }}
        INPUT_VERIFY: ${{ inputs.verify-specs }}
        INPUT_COMMENT_PR: ${{ inputs.comment-pr }}
      run: |
        hgb ci-action \
          --task "$INPUT_TASK" \
          --summary

    - name: Validate Masterclass Chapters (Ch1-Ch8 Invariant Verification)
      id: validate-masterclass-step
      if: inputs.validate-masterclass == 'true'
      shell: bash
      run: |
        echo "Validating all 8 Masterclass Chapters..."
        if command -v uv &> /dev/null; then
          uv run --with reportlab python docs/masterclass/generate_pdf.py --validate-all
        elif [ -f "$HOME/.local/bin/uv" ]; then
          "$HOME/.local/bin/uv" run --with reportlab python docs/masterclass/generate_pdf.py --validate-all
        elif command -v python3 &> /dev/null; then
          python3 docs/masterclass/generate_pdf.py --validate-all
        else
          python docs/masterclass/generate_pdf.py --validate-all
        fi
        echo "validated=true" >> "$GITHUB_OUTPUT"

    - name: Automate Masterclass & Documentation Pipeline
      if: inputs.regenerate-docs == 'true'
      shell: bash
      run: |
        if command -v uv &> /dev/null; then
          uv run --with reportlab python docs/masterclass/generate_pdf.py
        elif [ -f "$HOME/.local/bin/uv" ]; then
          "$HOME/.local/bin/uv" run --with reportlab python docs/masterclass/generate_pdf.py
        else
          python3 docs/masterclass/generate_pdf.py || true
        fi

    - name: Automated PGO + LLVM BOLT Optimization Pipeline
      id: pgo-bolt-optimizer
      if: inputs.optimize-pgo-bolt == 'true'
      shell: bash
      run: |
        echo "Executing Automated PGO + LLVM BOLT Layout Optimization..."
        chmod +x scripts/pgo-bolt-optimize.sh
        ./scripts/pgo-bolt-optimize.sh all
        echo "optimized=true" >> "$GITHUB_OUTPUT"
